<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Game for Boby</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      AOS.init({ duration: 1200, once: true });
      
      // Confetti on page load (avoiding overlap with button confetti)
      setTimeout(() => {
        confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });
      }, 500);

      // Keep music playing across pages using localStorage
      const audio = document.getElementById('bg-music');
      
      // Check if music was previously started
      if (localStorage.getItem('musicStarted') === 'true') {
        audio.play();
        audio.muted = false;
      } else {
        audio.muted = true;
        audio.play().then(() => {
          audio.muted = false;
          localStorage.setItem('musicStarted', 'true'); // Store that music has started
        }).catch(() => {
          // Fallback: requires user interaction
          const btn = document.createElement('button');
          btn.textContent = "Start Music";
          btn.style.position = "fixed";
          btn.style.top = "20px";
          btn.style.left = "20px";
          btn.style.zIndex = "10000";
          btn.onclick = () => {
            audio.play();
            localStorage.setItem('musicStarted', 'true'); // Store that music has started
            btn.remove();
          };
          document.body.appendChild(btn);
        });
      }
    });
  </script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #fff;
      text-align: center;
      padding: 30px;
      animation: fadeIn 2s ease-out;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    h1 {
      font-size: 3rem;
      color: #ff4081;
      animation: bounceIn 1s ease-in-out;
      text-shadow: 0 0 15px rgba(255, 64, 129, 0.8);
    }
    .me{
      font-size: 4rem;
      color: #fa6899;
      animation: bounceIn 1s ease-in-out;
      text-shadow: 0 0 15px rgba(255, 64, 129, 0.8);
    }

    .game-box {
      background: rgba(255, 255, 255, 0.1);
      padding: 30px;
      margin-top: 20px;
      max-width: 500px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      animation: slideIn 1s ease-in-out;
    }

    .btn {
      display: inline-block;
      margin: 15px;
      padding: 15px 25px;
      background: rgba(255, 64, 129, 0.9);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1.2em;
      transition: transform 0.2s, background-color 0.3s;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .btn:hover {
      transform: scale(1.1);
      background-color: #f50057;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
    }

    .message-container {
      margin-top: 30px;
      display: none; /* Initially hidden */
      font-size: 1.4em;
      font-weight: bold;
      padding: 20px;
      border-radius: 12px;
      background-color: rgba(255, 64, 129, 0.7);
      color: white;
      animation: popUp 1s ease-out forwards;
    }

    nav a {
      margin: 10px;
      font-size: 1.2em;
      color: #ff4081;
      text-decoration: none;
      padding: 15px 30px;
      border-radius: 20px;
      background: rgba(255, 64, 129, 0.2);
      transition: background-color 0.3s;
    }

    nav a:hover {
      background-color: #ff4081;
      color: white;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes bounceIn {
      0% { transform: scale(0.5); opacity: 0; }
      60% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes slideIn {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes popUp {
      0% { transform: translateY(20px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  
  <!-- 🔊 Background music autoplay (hidden) -->
  <audio id="bg-music" src="song.mp3" autoplay loop></audio>
  <h1 class="me"> Messages</h1>
  <h1>🎮 Message Game for Boby 🎉</h1>

  <nav>
    <a href="index.html" class="btn" onclick="parent.document.getElementById('content-frame').src='index.html'; return false;">Home</a>
    <a href="gallery.html" class="btn" onclick="parent.document.getElementById('content-frame').src='gallery.html'; return false;">Go to Gallery</a>
    <a href="love-game.html" class="btn" onclick="parent.document.getElementById('content-frame').src='love-game.html'; return false;">Play Love Meter Game</a>
  </nav>

  <div class="game-box">
    <p>Click the button below to receive a sweet (and silly) message from Pete 💕</p>
    <button class="btn" onclick="generateMessage()">Reveal Message</button>
    <p>Keep clicking 💕</p>
    <div class="message-container" id="bobyMessage"></div>
  </div>

  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init({ duration: 1200, once: true });

    const messages = [
      "You're the peanut butter to my jelly, the cheese to my pizza! 🧀🍕",
      "If kisses were snowflakes, I'd send you a blizzard 💋❄️",
      "You're cuter than all the puppies in the world combined 🐶❤️",
      "I love you more than chocolate on a Monday 🍫",
      "You stole my heart, but I’ll let you keep it 💘",
      "You're the sparkle in my eyes and the fries to my burger 🍟🍔",
      "No matter what, you’re always my favorite human ❤️🧍",
      "You + Me = 💯 Forever and ever (with snacks!) 🥤🍿",
      "You're the sun to my sky, the sparkle to my star! ✨🌞",
      "You're the milk to my cookies, the icing on my cake! 🍪🎂",
      "Without you, my world would be like a pencil with no lead—pointless! ✏️❤️",
      "If I could rearrange the alphabet, I'd put U and I together! 💌",
      "You're the ketchup to my fries, the honey to my tea! 🍯🍟",
      "You're the reason I wake up with a smile every day. 😁💖",
      "Like a puzzle, you're the missing piece that completes me! 🧩❤️",
      "If love was a game, you'd be the winning ticket! 🎟️💖",
      "You're the melody to my heart, the beat of my soul! 🎶💓",
      "I love you more than coffee, and that's saying a lot! ☕💘",
      "You're my favorite notification to wake up to! 📱💖",
      "You're the spark to my fire, the flame that keeps me warm! 🔥❤️",
      "You're the rainbow after my rain, the calm after my storm! 🌈⛈️",
      "If I could give you the stars, I'd give you the whole sky! 🌌✨",
      "You're the sugar to my tea, the spice to my life! 🍯🍵",
      "You're the dream I never want to wake up from! 💭💖",
      "You're my heart’s favorite place to be! 💖🏡",
      "You're the cherry on top of my sundae, the best part of my day! 🍒🍦",
      "You're my sunshine on a cloudy day! 🌤️💖",
      "You're the sparkle in my life that makes everything shine! ✨🌟"
    ];

    function generateMessage() {
      const msg = messages[Math.floor(Math.random() * messages.length)];
      const display = document.getElementById('bobyMessage');
      display.textContent = msg;
      display.style.display = 'block'; // Show the message container
      display.style.animation = 'popUp 1s ease-out';
    }
  </script>
  

</body>
</html>
