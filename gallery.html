  <style>
    body {
      font-family: 'Orbitron', 'Comic Sans MS', cursive, sans-serif;
      background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1a1a40);
      background-size: 400% 400%;
      animation: gradientFlow 15s ease infinite;
      color: #e0e0e0;
      text-align: center;
      padding: 20px;
    }

    @keyframes gradientFlow {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    h1 {
      font-size: 3rem;
      animation: bounceIn 1s;
      color: #ff66b2;
      text-shadow: 0 0 5px #f266ff, 0 0 10px #493046;
    }
    .me {
      font-size: 3rem;
      animation: bounceIn 1s;
      color: #ff66b2;
      text-shadow: 0 0 5px #f266ff, 0 0 10px #493046;
    }

    nav {
      margin: 20px 0;
    }

    .btn {
      display: inline-block;
      margin: 5px;
      padding: 10px 20px;
      background: #ff66b2;
      color: white;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      font-size: 1.1em;
      transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
      box-shadow: 0 0 10px #ff66b2;
    }

    .btn:hover {
      background: #cc5599;
      transform: scale(1.05);
      box-shadow: 0 0 20px #ffccf9;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
      animation: fadeIn 1s ease-in-out;
    }

    .photo {
      position: relative;
      width: 100%;
      height: 200px;
      overflow: hidden;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(255, 255, 255, 0.1);
      transform: scale(1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo:hover {
      transform: scale(1.1);
      box-shadow: 0 8px 20px rgba(255, 255, 255, 0.2);
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      padding-top: 50px;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.9);
      text-align: center;
      animation: fadeInModal 0.5s ease-in-out;
    }

    .modal-content {
      margin: 5% auto;
      max-width: 80%;
      max-height: 80%;
      background-color: #1f1f2e;
      border-radius: 15px;
      position: relative;
      padding: 10px;
    }

    .modal-content img {
      width: 100%;
      height: auto;
      border-radius: 15px;
    }

    .modal-message {
      font-size: 1.5em;
      color: #ff66b2;
      margin-top: 15px;
      font-weight: bold;
      animation: fadeIn 1s;
    }

    .close {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 2em;
      color: #fff;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInModal {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes bounceIn {
      0% { transform: scale(0.5); opacity: 0; }
      60% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); }
    }

    @media (max-width: 768px) {
      h1 { font-size: 1.8em; }
      .btn { font-size: 1em; padding: 8px 16px; }
    }

    @media (max-width: 480px) {
      .photo { height: 150px; }
      .btn { font-size: 0.9em; padding: 6px 12px; }
    }
  </style>

  <!-- Add futuristic font -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">

  <!-- The Modal -->
  <div id="myModal" class="modal">
    <span class="close" onclick="closeModal()">&times;</span>
    <div class="modal-content">
      <img id="modalImage" src="" alt="Boby Image" />
      <div id="modalMessage" class="modal-message"></div>
    </div>
  </div>

  <script>
    function openModal(imageSrc, message) {
      document.getElementById("myModal").style.display = "block";
      document.getElementById("modalImage").src = "img/" + imageSrc;
      document.getElementById("modalMessage").textContent = message;
    }

    function closeModal() {
      document.getElementById("myModal").style.display = "none";
    }

    window.onclick = function(event) {
      if (event.target == document.getElementById("myModal")) {
        closeModal();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const audio = document.getElementById('bg-music');
      
      // Check if music was previously started
      if (localStorage.getItem('musicStarted') === 'true') {
        audio.play();
        audio.muted = false;
      } else {
        audio.muted = true;
        audio.play().then(() => {
          audio.muted = false;
          localStorage.setItem('musicStarted', 'true'); // Store that music has started
        }).catch(() => {
          // Fallback: requires user interaction
          const btn = document.createElement('button');
          btn.textContent = "Start Music";
          btn.style.position = "fixed";
          btn.style.top = "20px";
          btn.style.left = "20px";
          btn.style.zIndex = "10000";
          btn.onclick = () => {
            audio.play();
            localStorage.setItem('musicStarted', 'true'); // Store that music has started
            btn.remove();
          };
          document.body.appendChild(btn);
        });
      }
    });
  </script>
